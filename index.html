    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        :root{
            --bg-main:#1E1E26;
            --bg-card:#2A2A36;
            --primary:#5A2D82;
            --primary-light:#7B45A8;
            --text-main:#F0EDF5;
            --text-sub:#A8A3B5;
            --border:#383848;
            --success:#39B574;
            --warn:#E69540;
            --danger:#E25454;
        }
        html,body{
            min-height:100vh;
            background:var(--bg-main);
            color:var(--text-main);
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom,0px);
            overflow-x:hidden;
        }
        .page-wrap{
            min-height:100%;
            padding:16px;
            padding-bottom: calc(24px + env(safe-area-inset-bottom,0px));
        }
        .btn{
            min-height:48px;
            min-width:48px;
            padding:0 14px;
            border:none;
            border-radius:12px;
            font-size:15px;
            cursor:pointer;
            transition: opacity .2s;
            touch-action: manipulation;
            white-space:nowrap;
        }
        .btn:active{opacity:0.8;}
        .btn-primary{background:var(--primary);color:#fff;}
        .btn-danger{background:var(--danger);color:#fff;}
        .btn-outline{background:transparent;border:1px solid var(--primary-light);color:var(--primary-light);}
        .btn-success{background:var(--success);color:#fff;}
        .card{
            background:var(--bg-card);
            border-radius:16px;
            padding:18px;
            margin-bottom:16px;
            border:1px solid var(--border);
        }
        .card h3{margin-bottom:8px;color:var(--primary-light)}
        .card p{color:var(--text-sub);line-height:1.5}
        .month-row{
            display:grid;
            grid-template-columns: 1fr auto auto;
            gap:8px;
            padding:12px 0;
            border-bottom:1px solid var(--border);
            align-items:center;
        }
        .form-item{
            margin:14px 0;
        }
        .form-item label{
            display:block;
            margin-bottom:6px;
            color:var(--text-sub);
        }
        input, textarea, select{
            width:100%;
            background:#333342;
            border:1px solid var(--border);
            color:var(--text-main);
            border-radius:10px;
            padding:12px;
            font-size:16px;
        }
        input[readonly]{
            opacity:0.6;
            cursor:not-allowed;
        }
        .sub-form-block{
            border:1px dashed var(--primary-light);
            padding:14px;
            border-radius:12px;
            margin:12px 0;
        }
        .hidden{display:none !important;}
        .badge{
            padding:4px 8px;
            border-radius:6px;
            font-size:12px;
        }
        .badge-discount{background:rgba(90,45,130,0.3);color:#d9c7ec;}
        .badge-paid{background:rgba(57,181,116,0.25);color:#86e1b0;}
        .progress-bar-wrap{
            width:100%;
            height:8px;
            background:#383848;
            border-radius:99px;
            margin:8px 0;
        }
        .progress-bar-fill{
            height:100%;
            background:var(--primary);
            border-radius:99px;
        }
        .export-group{
            display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;
        }
        .chart-wrap{
            width:100%;
            height:260px;
            margin:16px 0;
        }
        .calendar-month-card{
            margin-bottom:16px;
        }
        .calendar-item{
            padding:10px;
            border-bottom:1px solid var(--border);
        }
        .search-wrap{
            margin-bottom:16px;
        }
        .setting-group{
            margin:12px 0;
        }
        .alert-card{
            border:1px solid var(--danger);
            background:rgba(226,84,84,0.12);
        }
        .red-text{
            color:var(--danger);
            font-weight:bold;
        }
        .year-grid{
            display:grid;
            grid-template-columns: repeat(3, 1fr);
            gap:10px;
            margin-top:16px;
        }
        .year-month-box{
            padding:14px;
            border-radius:12px;
            text-align:center;
            border:1px solid var(--border);
            cursor:pointer;
        }
        .year-month-box.unpaid-month{
            border-color:var(--danger);
            background:rgba(226,84,84,0.15);
        }
        .time-header{
            margin-bottom:12px;
            padding:12px;
            background:var(--bg-card);
            border-radius:16px;
            border:1px solid var(--border);
        }
        .encourage-text{
            text-align:center;
            font-size:16px;
            margin:14px 0 20px;
            color:#ffe8a3;
        }
        .loan-block{ padding:10px 0; border-bottom:1px solid var(--border); }
        .loan-block:last-child{ border-bottom:none; }

<body>
    <div class="page-wrap" id="app"></div>

    <script>
        const { jsPDF } = window.jspdf;
        let chartInstance = null;
        const DB_NAME = "DebtLedgerPWA";
        const DB_VERSION = 1;
        let db;
        let clockTimer;

        // ===== IndexedDB 正确 Promise 封装（关键修复点）=====
        // IDBRequest 不是 Promise，不能直接 await。必须包一层。
        function reqDone(request){
            return new Promise((resolve, reject)=>{
                request.onsuccess = ()=>resolve(request.result);
                request.onerror = ()=>reject(request.error);
            });
        }
        // 等待整个事务提交完成
        function txDone(tx){
            return new Promise((resolve, reject)=>{
                tx.oncomplete = ()=>resolve();
                tx.onerror = ()=>reject(tx.error);
                tx.onabort = ()=>reject(tx.error || new Error("事务被中止"));
            });
        }

        // ===== 农历转换（使用 lunar-javascript 库，CDN 加载；失败则优雅降级为空）=====
        function getLunarDate(gy, gm, gd) {
            try {
                if (typeof Solar === 'undefined' || !Solar.fromYmd) return '';
                const l = Solar.fromYmd(gy, gm, gd).getLunar();
                return l.getYearInGanZhi() + '年 ' + l.getMonthInChinese() + '月' + l.getDayInChinese();
            } catch (e) {
                return '';
            }
        }

        // 金额格式化 RMxxx.xx
        function rm(n){
            const v = Number(n);
            if(isNaN(v)) return "RM0.00";
            return "RM" + v.toFixed(2);
        }

        // 格式化日期 dd/mm/yyyy
        function formatDDMMYYYY(d){
            const dt = new Date(d);
            const day = String(dt.getDate()).padStart(2,"0");
            const month = String(dt.getMonth()+1).padStart(2,"0");
            const year = dt.getFullYear();
            return `${day}/${month}/${year}`;
        }

        // 12小时制时钟
        function get12hTime(){
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2,"0");
            const s = String(now.getSeconds()).padStart(2,"0");
            const ampm = h >=12 ? "PM" : "AM";
            h = h %12;
            if(h ===0) h=12;
            return `${h}:${m}:${s} ${ampm}`;
        }

        function timeHeaderInner(){
            const now = new Date();
            const lunarStr = getLunarDate(now.getFullYear(), now.getMonth()+1, now.getDate());
            return `
                <div style="font-size:22px;font-weight:bold">${get12hTime()}</div>
                <div>${formatDDMMYYYY(now)}${lunarStr ? '｜农历 ' + lunarStr : ''}</div>
            `;
        }
        function renderTimeHeader(){
            return `
                <div class="time-header" id="timeHeaderBox">${timeHeaderInner()}</div>
                <div class="encourage-text">加加油👊🏻，努努力💪🏻，很快就是自己的了😊</div>
            `;
        }
        function startClock(){
            if(clockTimer) clearInterval(clockTimer);
            clockTimer = setInterval(()=>{
                const box = document.getElementById("timeHeaderBox");
                if(box) box.innerHTML = timeHeaderInner();
            },1000);
        }

        function openDB(){
            return new Promise((res,rej)=>{
                const req = indexedDB.open(DB_NAME,DB_VERSION);
                req.onupgradeneeded = e=>{
                    db = e.target.result;
                    const loanStore = db.createObjectStore("loans",{keyPath:"id",autoIncrement:true});
                    loanStore.createIndex("name","name");
                    const segmentStore = db.createObjectStore("segments",{keyPath:"id",autoIncrement:true});
                    segmentStore.createIndex("loanId","loanId");
                    const scheduleStore = db.createObjectStore("schedules",{keyPath:"id",autoIncrement:true});
                    scheduleStore.createIndex("loanId","loanId");
                    const settingStore = db.createObjectStore("settings",{keyPath:"key"});
                };
                req.onsuccess = e=>{db = e.target.result;res(db);};
                req.onerror = e=>rej(e.target.error);
            })
        }

        const state = {
            currentView:"home",
            currentLoanId:null,
            loans:[],
            segments:[],
            schedules:[],
            calendarYear: new Date().getFullYear(),
            calendarMonth: new Date().getMonth(),
            monthViewReturn:"home",
            searchKeyword:"",
            settings:{
                remindDays:2
            }
        }

        async function loadSettings(){
            const tx = db.transaction("settings");
            const store = tx.objectStore("settings");
            const res = await reqDone(store.get("remindDays"));
            if(res){
                state.settings.remindDays = res.value;
            }
        }
        async function saveRemindDays(val){
            const tx = db.transaction("settings","readwrite");
            await reqDone(tx.objectStore("settings").put({key:"remindDays",value:Number(val)}));
            await txDone(tx);
            state.settings.remindDays = Number(val);
            alert("提醒天数已保存");
        }

        function calcRepayDate(startDate, periodNum, repayDay){
            const d = new Date(startDate);
            d.setMonth(d.getMonth() + (periodNum-1));
            d.setDate(repayDay);
            return d;
        }

        // 待还/逾期：仅统计「已过还款日且未还」的月份；未来未到期不算待还
        function getUnpaidMonthList(){
            const now = new Date();
            const unpaidSet = new Set();
            state.schedules.forEach(sch=>{
                if(!sch.isPaid && new Date(sch.repayDate) <= now){
                    const dt = new Date(sch.repayDate);
                    unpaidSet.add(`${dt.getFullYear()}-${dt.getMonth()}`);
                }
            })
            const list = Array.from(unpaidSet).map(k=>{
                const [y,m] = k.split("-").map(Number);
                return {year:y,month:m};
            })
            list.sort((a,b)=>{
                if(a.year !== b.year) return a.year - b.year;
                return a.month - b.month;
            })
            return list;
        }

        async function createLoan(loanInfo, segmentList){
            const tx = db.transaction(["loans","segments","schedules"],"readwrite");
            const loanStore = tx.objectStore("loans");
            const segStore = tx.objectStore("segments");
            const schStore = tx.objectStore("schedules");
            // 关键修复：await 的是 reqDone(请求) 拿到的自增主键，而不是 IDBRequest 本身
            const loanId = await reqDone(loanStore.add(loanInfo));
            for(let seg of segmentList){
                seg.loanId = loanId;
                await reqDone(segStore.add(seg));
            }
            if(loanInfo.loanType === "long"){
                // 长期贷款：无固定总额/起息日/期数，从当前月起向前生成约 10 年账单，全部待还
                const base = new Date();
                base.setDate(1); base.setHours(0,0,0,0);
                const LONG_HORIZON = 120;
                for(let p=1; p<=LONG_HORIZON; p++){
                    const d = new Date(base);
                    d.setMonth(base.getMonth() + (p-1));
                    d.setDate(loanInfo.repayDay);
                    const scheduleItem = {
                        loanId:loanId,
                        period:p,
                        repayDate:d.toISOString(),
                        baseAmount:0,
                        segNote:"长期债务（无固定金额）",
                        tempDiscount:0,
                        tempDiscountReason:"",
                        finalPayable:0,
                        isPaid:false,
                        actualPayDate:null,
                        actualPayAmount:0,
                        diff:0
                    };
                    await reqDone(schStore.add(scheduleItem));
                }
            } else {
                const totalPeriod = loanInfo.totalPeriod;
                for(let p=1; p<=totalPeriod; p++){
                    const matchSeg = segmentList.find(s=> p >= s.startPeriod && p <= s.endPeriod);
                    const repayDate = calcRepayDate(new Date(loanInfo.startDate), p, loanInfo.repayDay);
                    const scheduleItem = {
                        loanId:loanId,
                        period:p,
                        repayDate:repayDate.toISOString(),
                        baseAmount: matchSeg?.amount || 0,
                        segNote: matchSeg?.note || "",
                        tempDiscount:0,
                        tempDiscountReason:"",
                        finalPayable: matchSeg?.amount ||0,
                        isPaid:false,
                        actualPayDate:null,
                        actualPayAmount:0,
                        diff:0
                    }
                    await reqDone(schStore.add(scheduleItem));
                }
            }
            await txDone(tx);
            await loadAllData();
            state.currentView="home";
            render();
            return loanId;
        }

        async function updateLoanBasic(loanData){
            const tx = db.transaction("loans","readwrite");
            await reqDone(tx.objectStore("loans").put(loanData));
            await txDone(tx);
            await loadAllData();
            state.currentView="home";
            render();
            alert("贷款基础信息已更新");
        }

        async function deleteLoan(loanId){
            const tx = db.transaction(["loans","segments","schedules"],"readwrite");
            await reqDone(tx.objectStore("loans").delete(loanId));
            const segIdx = tx.objectStore("segments").index("loanId");
            await new Promise((resolve,reject)=>{
                const req = segIdx.openCursor(IDBKeyRange.only(loanId));
                req.onsuccess = e=>{const cur=e.target.result; if(cur){cur.delete();cur.continue();} else resolve();};
                req.onerror = ()=>reject(req.error);
            });
            const schIdx = tx.objectStore("schedules").index("loanId");
            await new Promise((resolve,reject)=>{
                const req = schIdx.openCursor(IDBKeyRange.only(loanId));
                req.onsuccess = e=>{const cur=e.target.result; if(cur){cur.delete();cur.continue();} else resolve();};
                req.onerror = ()=>reject(req.error);
            });
            await txDone(tx);
            await loadAllData();
            state.currentView="home";
            render();
        }

        async function loadAllData(){
            state.loans = await getAll("loans");
            state.segments = await getAll("segments");
            state.schedules = await getAll("schedules");
            await loadSettings();
        }
        function getAll(storeName){
            return new Promise((res,rej)=>{
                const s = db.transaction(storeName).objectStore(storeName);
                const req = s.getAll();
                req.onsuccess = e=>res(e.target.result);
                req.onerror=e=>rej(e.target.error);
            })
        }

            const tx = db.transaction("schedules","readwrite");
            await reqDone(tx.objectStore("schedules").put(schedule));
            await txDone(tx);

        async function markCarLoanPaidExceptAugSep2026(silent=false){

            const tx = db.transaction("schedules","readwrite");
            const schStore = tx.objectStore("schedules");
            const allSchedules = state.schedules.filter(s=>s.loanId === carLoan.id);
            for(let sch of allSchedules){
                const d = new Date(sch.repayDate);
                const y = d.getFullYear(), mo = d.getMonth();
                // 仅把 2026-08 之前（历史已还）标记已还；2026-08、09 及未来保持未还（贷款未结清）

                    sch.isPaid = true;
                    sch.actualPayDate = sch.repayDate;

        function exportCSV(){
            let csv = "贷款名称,合同总额,期数,还款日,合同基准月供,分段备注,临时减免,减免原因,本期应付,是否已还,实际还款,差额\n";
            for(let sch of state.schedules){
                const loan = state.loans.find(l=>l.id === sch.loanId);
                const repayDt = formatDDMMYYYY(sch.repayDate);
                const row = [
                    `"${loan?.name||''}"`,
                    loan?.totalAmount??0,
                    sch.period,
                    `"${repayDt}"`,
                    sch.baseAmount,
                    `"${sch.segNote||''}"`,
                    sch.tempDiscount,
                    `"${sch.tempDiscountReason||''}"`,
                    sch.finalPayable,
                    sch.isPaid?"是":"否",
                    sch.actualPayAmount,
                    sch.diff
                ].join(",");
                csv += row + "\n";
            }
            const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `债务台账_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;

        window.importJSON = async function(fileInput){
            const file = fileInput.files[0];
            if(!file) return;
            const text = await file.text();
            const data = JSON.parse(text);
            const tx = db.transaction(["loans","segments","schedules"],"readwrite");
            await reqDone(tx.objectStore("loans").clear());
            await reqDone(tx.objectStore("segments").clear());
            await reqDone(tx.objectStore("schedules").clear());
            for(let l of data.loans) await reqDone(tx.objectStore("loans").add(l));
            for(let s of data.segments) await reqDone(tx.objectStore("segments").add(s));
            for(let sc of data.schedules) await reqDone(tx.objectStore("schedules").add(sc));
            await txDone(tx);
            await loadAllData();
            alert("导入成功！");
            render();
        }

        window.exportPDF = async function(){
            try{
                const node = document.getElementById("app");
                const canvas = await html2canvas(node,{backgroundColor:"#1E1E26",scale:2});
                const img = canvas.toDataURL("image/png");
                const doc = new jsPDF("p","mm","a4");
                const pw = doc.internal.pageSize.getWidth();
                const ph = doc.internal.pageSize.getHeight();
                const imgW = pw;
                const imgH = canvas.height * imgW / canvas.width;
                let position = 0;
                doc.addImage(img,"PNG",0,position,imgW,imgH);
                position -= ph;
                while(position > -imgH){
                    doc.addPage();
                    doc.addImage(img,"PNG",0,position,imgW,imgH);
                    position -= ph;
                }
                doc.save(`债务台账_${new Date().toISOString().slice(0,10)}.pdf`);
            }catch(err){
                alert("PDF 导出失败：" + (err && err.message ? err.message : err));
            }
        }

            const labels = schedules.map(x=>`P${x.period}`);

            const discountData = schedules.map(x=>Number(x.tempDiscount));
            const ctx = document.getElementById("chartCanvas");
            if(!ctx) return;
            chartInstance = new Chart(ctx,{
                type:"bar",
                data:{
                    labels:labels,
                    datasets:[
                        {label:"本期应付",data:payableData,backgroundColor:"#5A2D82"},
                        {label:"临时减免",data:discountData,backgroundColor:"#E69540"}

                options:{

                }
            })

        // 首页每笔贷款的 12 格月视图（当年 1-12 月，绿=已结清 红=待还/逾期(带⚠️) 蓝=未到期 灰=无账单）
        function loanMonthSquares(loan){
            const year = new Date().getFullYear();
            const now = new Date();
            let cells = '';
            for(let m=0;m<12;m++){
                const sched = state.schedules.find(s=>{
                    if(s.loanId !== loan.id) return false;
                    const d = new Date(s.repayDate);
                    return d.getFullYear() === year && d.getMonth() === m;
                });
                let cls = 'msq sq-empty', label = String(m+1), attr = '', title = `${year}年${m+1}月`;
                if(sched){
                    const st = scheduleState(sched, now);
                    cls = st==='paid' ? 'msq sq-paid' : (st==='overdue' ? 'msq sq-unpaid' : 'msq sq-future');
                    if(st==='overdue') label = '⚠️' + (m+1);
                    title += st==='paid' ? ' 已结清' : (st==='overdue' ? ' 逾期未还' : ' 未到期');
                    attr = ` onclick="goMonthView(${year},${m})" title="${title}"`;
                }
                cells += `<div class="${cls}"${attr}>${label}</div>`;
            }
            return `<div class="msq-grid">${cells}</div>`;
        }

        // 单期状态：已结清 / 待还(逾期未还) / 未到期(未来)
        function scheduleState(sch, now){
            now = now || new Date();
            if(sch.isPaid) return 'paid';
            return new Date(sch.repayDate) <= now ? 'overdue' : 'future';
        }
        function loanPaidAmount(loan){
            return state.schedules
                .filter(s=>s.loanId===loan.id && s.isPaid)
                .reduce((a,s)=>a + (Number(s.actualPayAmount)||0), 0);
        }
        function loanStatusLine(loan){
            const ss = state.schedules.filter(s=>s.loanId===loan.id);
            const now = new Date();
            const paid = ss.filter(s=>s.isPaid).length;
            const overdue = ss.filter(s=>!s.isPaid && new Date(s.repayDate) <= now).length;
            const future = ss.length - paid - overdue;
            if(loan.loanType === 'long') return `长期 · 已还 ${paid} · 未到期 ${future} 期`;
            return `已还 ${paid}/${ss.length} · 待还 ${overdue} · 未到期 ${future}`;
        }

        function render(){
            const app = document.getElementById("app");
            const unpaidList = getUnpaidMonthList();
            if(state.currentView === "home"){
                app.innerHTML = renderTimeHeader() + `
                <h2>债务台账工作台</h2>
                ${unpaidList.length>0 ? `
                <div class="card alert-card">
                    <h3 class="red-text">⚠️ 待还款月份</h3>
                    <p>${unpaidList.slice(0,12).map(m=>`<button class="btn btn-outline" onclick="goMonthView(${m.year},${m.month})">${m.year}年${m.month+1}月</button>`).join(" ")}</p>
                    ${unpaidList.length>12 ? `<p class="red-text">共 ${unpaidList.length} 个待还月份（仅显示最近 12 个）</p>`:""}
                </div>`:""}
                <div class="card">
                    <h3>贷款列表</h3>
                    <div class="legend">
                        <span class="lg-paid">已结清</span>
                        <span class="lg-unpaid">待还</span>
                        <span class="lg-future">未到期</span>
                        <span class="lg-empty">无账单</span>
                    </div>
                    ${state.loans.map(loan=>`
                        <div class="loan-block">
                            <div class="month-row">
                                <div>${loan.name}</div>
                                <div>${loan.loanType === 'long' ? '长期·无固定总额' : '总额 ' + rm(loan.totalAmount)} · 已还 ${rm(loanPaidAmount(loan))}</div>
                                <button class="btn btn-outline" onclick="goLoanDetail(${loan.id})">明细</button>
                            </div>
                            ${loanMonthSquares(loan)}
                            <div class="loan-sub">${loanStatusLine(loan)}</div>
                        </div>
                    `).join("")}
                </div>
                <div class="export-group">
                    <button class="btn btn-primary" onclick="state.currentView='addLoan';render()">新增贷款</button>
                    <button class="btn btn-outline" onclick="state.currentView='yearView';render()">年度日历视图</button>
                    <button class="btn btn-outline" onclick="exportCSV()">导出CSV</button>
                    <button class="btn btn-outline" onclick="exportJSON()">备份JSON</button>
                </div>
                `
            }else if(state.currentView === "yearView"){
                app.innerHTML = `
                <h2>年度日历视图</h2>
                <div class="year-grid">
                ${Array.from({length:12},(_,i)=>{
                    const hasUnpaid = unpaidList.some(x=>x.year===state.calendarYear && x.month===i);
                    return `<div class="year-month-box ${hasUnpaid?'unpaid-month':''}" onclick="goMonthView(${state.calendarYear},${i})">${state.calendarYear}年${i+1}月 ${hasUnpaid?"⏳待还":""}</div>`
                }).join("")}
                </div>
                <div class="export-group">
                    <button class="btn btn-outline" onclick="state.calendarYear--;render()">上一年</button>
                    <button class="btn btn-outline" onclick="state.calendarYear++;render()">下一年</button>
                    <button class="btn btn-outline" onclick="state.currentView='home';render()">返回首页</button>
                </div>
                `
            }else if(state.currentView === "monthView"){
                const monthSchedules = state.schedules.filter(s=>{
                    const d = new Date(s.repayDate);
                    return d.getFullYear()===state.calendarYear && d.getMonth()===state.calendarMonth;
                })
                app.innerHTML=`
                <h2>${state.calendarYear}年${state.calendarMonth+1}月账单</h2>
                <div class="calendar-month-card">
                ${monthSchedules.map(sch=>{
                    const loan = state.loans.find(l=>l.id === sch.loanId);
                    return `
                    <div class="calendar-item">
                        <div><b>${loan?.name}</b> 第${sch.period}期</div>
                        <div>还款日: ${formatDDMMYYYY(sch.repayDate)}</div>
                        <div>应付 ${rm(sch.finalPayable)} ${sch.isPaid?"✅已结清":(scheduleState(sch)==='overdue'?"⏳待还":"🕓未到期")}</div>
                        <button class="btn btn-outline" onclick="togglePaid(${sch.id})">切换已还/未还</button>
                    </div>
                    `
                }).join("")}
                </div>
                <button class="btn btn-outline" onclick="state.currentView = state.monthViewReturn || 'home'; render()">${state.monthViewReturn === 'yearView' ? '返回年度视图' : '返回首页'}</button>
                `
            }else if(state.currentView === "loanDetail"){
                const loan = state.loans.find(l=>l.id === state.currentLoanId);
                const loanSchedules = state.schedules.filter(s=>s.loanId===loan.id).sort((a,b)=>a.period-b.period);
                const isLong = loan.loanType === 'long';
                const now = new Date();
                const paidCount = loanSchedules.filter(s=>s.isPaid).length;
                const overdueCount = loanSchedules.filter(s=>!s.isPaid && new Date(s.repayDate) <= now).length;
                const futureCount = loanSchedules.length - paidCount - overdueCount;
                const basicInfo = isLong
                    ? `类型：长期（无固定期限）<br/>每月 ${loan.repayDay} 号还款<br/>备注:${loan.note||""}`
                    : `总额 ${rm(loan.totalAmount)}<br/>起息日:${formatDDMMYYYY(loan.startDate)}<br/>总期数:${loan.totalPeriod}期，每月${loan.repayDay}号还款<br/>备注:${loan.note||""}`;
                const summaryLine = isLong
                    ? `已还 <b>${paidCount}</b> 期 · 未到期 <b>${futureCount}</b> 期（长期债务，无固定总额）`
                    : `已还 <b>${paidCount}</b> / 共 ${loanSchedules.length} 期 · 待还 <b>${overdueCount}</b> · 未到期 <b>${futureCount}</b>`;
                let bodyHtml;
                if(isLong){
                    // 长期贷：不列 120 行 RM0，改为年度方格 + 汇总
                    bodyHtml = `
                    <div class="card">
                        <p style="font-size:13px;color:var(--text-sub)">长期债务无固定金额，标记已还时请填写当月实付金额。点下方方格进入对应月份账单切换。</p>
                        ${loanMonthSquares(loan)}
                        <div class="legend">
                            <span class="lg-paid">已结清</span>
                            <span class="lg-unpaid">待还</span>
                            <span class="lg-future">未到期</span>
                            <span class="lg-empty">无账单</span>
                        </div>
                    </div>`;
                }else{
                    bodyHtml = `
                    <div class="chart-wrap"><canvas id="chartCanvas"></canvas></div>
                    <div class="card">
                        ${loanSchedules.map(sch=>`
                        <div class="month-row">
                            <div>P${sch.period}</div>
                            <div>${formatDDMMYYYY(sch.repayDate)} ${rm(sch.finalPayable)} ${sch.isPaid?"✅已结清":(scheduleState(sch)==='overdue'?"⏳待还":"🕓未到期")}</div>
                            <button class="btn btn-outline" onclick="togglePaid(${sch.id})">切换</button>
                        </div>
                        `).join("")}
                    </div>`;
                }
                app.innerHTML=`
                <h2>${loan.name}</h2>
                <div class="card">
                    <p>${basicInfo}</p>
                </div>
                <div class="card"><p>${summaryLine}</p></div>
                ${bodyHtml}
                <button class="btn btn-outline" onclick="state.currentView='home';render()">返回首页</button>
                `
                if(!isLong) setTimeout(()=>drawChart(loan.id),100);
            }else if(state.currentView === "addLoan"){
                app.innerHTML=`
                <h2>新增贷款</h2>
                <div class="card">
                    <div class="form-item">
                        <label>贷款名称</label>
                        <input id="loanName" />
                    </div>
                    <div class="form-item">
                        <label>贷款类型</label>
                        <select id="loanType" onchange="toggleLoanFields()">
                            <option value="timed">时效（有总额 / 起息日 / 期数）</option>
                            <option value="long">长期（无固定期限，持续还款）</option>
                        </select>
                    </div>
                    <div id="timedFields">
                        <div class="form-item">
                            <label>总金额</label>
                            <input id="loanTotal" type="number" step="0.01"/>
                        </div>
                        <div class="form-item">
                            <label>起息日（点选，无需手填）</label>
                            <input id="loanStart" type="date"/>
                        </div>
                        <div class="form-item">
                            <label>总期数</label>
                            <input id="loanPeriod" type="number"/>
                        </div>
                    </div>
                    <div class="form-item">
                        <label>每月还款日（仅填数字，如 10）</label>
                        <input id="loanRepayDay" type="number"/>
                    </div>
                    <div class="form-item">
                        <label>备注</label>
                        <textarea id="loanNote"></textarea>
                    </div>
                    <p id="loanHint">时效贷款：默认每期金额相同，如需分段需要修改代码。</p>
                    <button class="btn btn-primary" onclick="submitAddLoan()">提交新增</button>
                </div>
                <button class="btn btn-outline" onclick="state.currentView='home';render()">返回首页</button>
                `
            }
        }

        // 应用内弹窗（替代 window.prompt：手机 PWA/standalone 模式下浏览器会禁用 prompt，导致“切换没反应”）
        function appPrompt(message, defaultVal){
            return new Promise((resolve)=>{
                const overlay = document.createElement("div");
                overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;";
                const box = document.createElement("div");
                box.style.cssText = "background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:18px;max-width:320px;width:100%;";
                box.innerHTML = `
                    <p style="margin-bottom:12px;color:var(--text-main)">${message}</p>
                    <input id="appPromptInput" type="number" step="0.01" inputmode="decimal" value="${defaultVal||''}" style="margin-bottom:14px;" />
                    <div style="display:flex;gap:8px;justify-content:flex-end">
                        <button class="btn btn-outline" id="appPromptCancel">取消</button>
                        <button class="btn btn-primary" id="appPromptOk">确定</button>
                    </div>`;
                overlay.appendChild(box);
                document.body.appendChild(overlay);
                const input = box.querySelector("#appPromptInput");
                const finish = (v)=>{ overlay.remove(); resolve(v); };
                input.focus();
                box.querySelector("#appPromptCancel").onclick = ()=> finish(null);
                box.querySelector("#appPromptOk").onclick = ()=> finish(input.value);
                input.onkeydown = (e)=>{
                    if(e.key==="Enter") finish(input.value);
                    else if(e.key==="Escape") finish(null);
                };
            });
        }

        window.togglePaid = async function(scheduleId){
            const sch = state.schedules.find(x=>x.id === scheduleId);
            if(!sch) return;
            if(sch.isPaid){
                // 取消已还
                sch.isPaid = false;
                sch.actualPayDate = null;
                sch.actualPayAmount = 0;
            }else{
                // 标记为已还：用应用内弹窗填实付金额（长期贷无固额则留空让用户输入）
                const def = sch.finalPayable > 0 ? String(Number(sch.finalPayable).toFixed(2)) : "";
                const input = await appPrompt("本次实付金额（RM）：", def);
                if(input === null || input === undefined || input === "") return; // 取消或不填则不改动
                const amt = parseFloat(input);
                if(isNaN(amt) || amt < 0){ alert("金额无效，已取消"); return; }
                sch.isPaid = true;
                sch.actualPayDate = new Date().toISOString();
                sch.actualPayAmount = amt;
            }
            await updateSchedule(sch);
        }
        window.goMonthView = function(y,m){
            state.calendarYear = y;
            state.calendarMonth = m;
            // 记录来源：从首页小格子进入则回首页，从年度视图进入则回年度视图
            state.monthViewReturn = (state.currentView === "yearView") ? "yearView" : "home";
            state.currentView="monthView";
            render();
        }
        window.goLoanDetail = function(id){
            state.currentLoanId = id;
            state.currentView="loanDetail";
            render();
        }

        window.toggleLoanFields = function(){
            const type = document.getElementById("loanType").value;
            const tf = document.getElementById("timedFields");
            const hint = document.getElementById("loanHint");
            if(type === "long"){
                tf.classList.add("hidden");
                hint.textContent = "长期贷款：无需填写总额 / 起息日 / 期数，会按月持续生成待还账单（当前月起约 10 年）。";
            }else{
                tf.classList.remove("hidden");
                hint.textContent = "时效贷款：默认每期金额相同，如需分段需要修改代码。";
            }
        }
        window.submitAddLoan = async function(){
            const name = (document.getElementById("loanName").value || "").trim();
            const type = document.getElementById("loanType").value;
            const repayDay = parseInt(document.getElementById("loanRepayDay").value);
            const note = document.getElementById("loanNote").value;
            if(!name || isNaN(repayDay)){ alert("请填写贷款名称与每月还款日"); return; }
            if(type === "long"){
                const loanInfo = {
                    name, loanType:"long", totalAmount:null, startDate:null,
                    totalPeriod:null, repayDay:repayDay, note: note || "长期债务"
                };
                await createLoan(loanInfo, []);
                return;
            }
            const total = parseFloat(document.getElementById("loanTotal").value);
            const start = document.getElementById("loanStart").value;
            const period = parseInt(document.getElementById("loanPeriod").value);
            if(isNaN(total) || !start || isNaN(period)){ alert("请完整填写时效贷款信息（总额 / 起息日 / 期数）"); return; }
            const amountPerPeriod = total / period;
            const loanInfo = {
                name, loanType:"timed", totalAmount:total, startDate:start,
                totalPeriod:period, repayDay:repayDay, note
            }
            const segList = [{startPeriod:1,endPeriod:period,amount:amountPerPeriod,note:`每期${rm(amountPerPeriod)}`}]
            await createLoan(loanInfo,segList);
        }

        async function init(){
            await openDB();
            await loadAllData();
            await seedPresetData();
            await loadAllData();
            startClock();
            render();
            // 注册 Service Worker 实现离线（仅 http(s) 环境下生效）
            if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
                navigator.serviceWorker.register('service-worker.js').catch(()=>{});
            }
        }
        init();
    </script>
</body>
</html>
